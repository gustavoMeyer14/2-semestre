<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete do Zé - Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- navbar: barra de menu | navbar-expand-md: aberta no pc, recolhida no celular
                               | navbar-dark: deixa o texto claro-->
    <nav class="navbar navbar-expand-md bg-dark navbar-dark">
        <!-- container: centraliza o conteudo e deixa as margens nas laterais-->
        <div class="container">
            <!-- navbar-brand: nome/logo do site-->
            <a class="navbar-brand" href="index.html">🍔 Lanchonete do Zé</a>

            <!-- navbar-toggler: botão "hamburguer" que aparece só no celular-->
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-taget="#menu" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- collapse: parte do menu que esconde/mostra ao clicar no botão-->
            <div class="collapse navbar-collapse" id="menu">
                <!-- navbar-nav: lista de links | ms-auto: empurra os links para a direita-->
                <ul class="navbar-nav ms-auto">
                    <!-- nav-link: estilo do link | active: destaca a página atual-->
                    <li class="nav-item"><a class="nav-link active" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="cardapio.html">Cardápio</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                    <li class="nav-item"><a class="nav-link" href="sobre_nos.html">Sobre nós</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- container: centraliza | py-5: espaço (padding) em cima e embaixo-->
    <main class="container py-5">
        <!-- bg-light: fundo cinza claro | p-5: espaço interno grande
             rounded: bordas arredondadas | text-center: texto centralizado-->
        <div class="bg-light p-5 rounded text-center">
            <!-- display 4: titulo bem grande | fw-bold: negrito-->
            <h1 class="display 4 fw-bold">Bem-vindo à Lanchonete do Zé!</h1>
            <!-- Lead: texto de destaque, um pouco maior que o normal-->
            <p class="lead">Os melhores lanches da cidade de Joinville, feitos na hora.</p>
            <!-- btn : vira botão | btn warning: cor amarela | btn-lg: botão grande-->
            <a href="cardapio.html" class="btn btn-warning btn-lg">Ver Cardápio</a>
        </div>
    </main>

    <!-- JS do Bootstrap: necessário para o botão hambúrguer funcionar-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
