<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 01 - Estrutura com bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-mortarboard-fill me-2"></i>Sistema Escolar</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="#painel">Painel</a></li>
                    <li class="nav-item"><a class="nav-link" href="#alunos">Alunos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <section id="painel" class="mb-4">
            <h1 class="h3 mb-3">Painel</h1>
            <div class="row g-3">
                <div class="col-12 col-md-4">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body">
                            <div class="text-body-secondary small">Total de alunos</div>
                            <div class="fs-3 fw-bold">3</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="text-body-secondary small">Média geral</div>
                        <div class="fs-3 fw-bold">7,3</div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between small mb-2">
                            <span class="text-body-secondary">Aprovados</span><span class="fw-semibold">67%</span>
                        </div>
                        <div class="progress" role="progressbar" aria-label="Aprovados">
                            <div class="progress-bar bg-success" style="width: 67%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="alunos">
            <div class="card border-0 shadow-sm">
                <div class="car-header bg-body py-3"><h2 class="h5 mb-0">Alunos</h2></div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr><th>Nome</th><th>Turma</th><th class="text-center">Média</th><th>Situação</th></tr>
                        </thead>
                        <tbody>
                            <tr><td>Ana Souza</td><td><span class="badge text-bg-secondary">1º Ano A</span></td>
                                <td class="text-center">8,8</td><td><span class="badge text-bg-success">Aprovado</span></td></tr>
                            <tr><td>Bruno Lima</td><td><span class="badge text-bg-secondary">1º Ano B</span></td>
                                <td class="text-center">5,8</td><td><span class="badge text-bg-danger">Reprovado</span></td></tr>
                            <tr><td>Carla Menezes</td><td><span class="badge text-bg-secondary">2º Ano A</span></td>
                                <td class="text-center">7,3</td><td><span class="badge text-bg-success">Aprovado</span></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
